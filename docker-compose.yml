services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  app-1:
    build: .
    hostname: app-1
    ports:
      - "8081:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_ID: app-1
    depends_on:
      redis:
        condition: service_healthy

  app-2:
    build: .
    hostname: app-2
    ports:
      - "8082:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_ID: app-2
    depends_on:
      redis:
        condition: service_healthy
